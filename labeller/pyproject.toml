[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathladder"
version = "0.1.0"
description = "Schema-driven weak labels from GI pathology report free text"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pathladder = "pathladder.cli:main"

[tool.setuptools]
packages = ["pathladder"]
